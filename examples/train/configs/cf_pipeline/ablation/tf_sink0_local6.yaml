models:
  student:
    _target_: fastvideo.train.models.wan.WanCausalModel
    init_from: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
    trainable: true

method:
  _target_: fastvideo.train.methods.fine_tuning.tfsft.TeacherForcingSFTMethod
  chunk_size: 3
  streaming_teacher_forcing: true

training:
  distributed:
    num_gpus: 4
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 4
  data:
    data_path: /mnt/lustre/vlm-k1kong/datasets/HD-Mixkit-Finetune-Wan/combined_parquet_dataset
    dataloader_num_workers: 0
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 1000
    num_latent_t: 20
    num_height: 480
    num_width: 832
    num_frames: 77
  optimizer:
    learning_rate: 2.0e-6
    betas: [0.0, 0.999]
    weight_decay: 0.01
    lr_scheduler: constant
    lr_warmup_steps: 0
  loop:
    max_train_steps: 3000
    gradient_accumulation_steps: 1
  checkpoint:
    output_dir: __CHECKPOINT_DIR__
    resume_from_checkpoint: latest
    training_state_checkpointing_steps: 1000
    checkpoints_total_limit: 3
  tracker:
    trackers: [wandb]
    project_name: __PROJECT_NAME__
    run_name: __WANDB_RUN_NAME__
  model:
    enable_gradient_checkpointing_type: full

callbacks:
  grad_clip:
    max_grad_norm: 1.0
  validation:
    pipeline_target: fastvideo.pipelines.basic.wan.wan_causal_pipeline.WanCausalPipeline
    dataset_file: examples/training/finetune/Wan2.1-VSA/Wan-Syn-Data/validation_4.json
    every_steps: 200
    sampling_steps: [40]
    guidance_scale: 6.0
    num_frames: 77
    output_dir: __VALIDATION_DIR__
    offload_training_state: true
    unload_pipeline_after_validation: true

pipeline:
  flow_shift: 5
  dit_config:
    local_attn_size: 6
    sink_size: 0
