# CF++ pipeline Stage 2 — Causal Consistency Distillation (chunk-wise, Wan 1.3B)
# All three roles init from the Stage-1 TF export (frozen teacher+ema, trainable student).
# Output feeds Stage 3 (Self-Forcing) via dcp_to_diffusers export.

models:
  student:
    _target_: fastvideo.train.models.wan.WanCausalModel
    init_from: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
    transformer_override_safetensor: outputs/cf/export/tf/transformer/model.safetensors
    trainable: true
  teacher:
    _target_: fastvideo.train.models.wan.WanCausalModel
    init_from: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
    transformer_override_safetensor: outputs/cf/export/tf/transformer/model.safetensors
    trainable: false
  ema:
    _target_: fastvideo.train.models.wan.WanCausalModel
    init_from: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
    transformer_override_safetensor: outputs/cf/export/tf/transformer/model.safetensors
    trainable: false

method:
  _target_: fastvideo.train.methods.consistency_model.causal_cd.CausalConsistencyDistillationMethod
  discrete_cd_N: 48
  guidance_scale: 3.0
  ema_decay: 0.99
  ema_start_step: 200

training:
  distributed:
    num_gpus: 4
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 4

  data:
    data_path: data/Wan-Syn_77x448x832_600k
    dataloader_num_workers: 4
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 1000
    num_latent_t: 18
    num_height: 448
    num_width: 832
    num_frames: 69

  optimizer:
    learning_rate: 2.0e-6
    betas: [0.0, 0.999]
    weight_decay: 0.01
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    max_train_steps: 3000
    gradient_accumulation_steps: 1

  checkpoint:
    output_dir: outputs/cf/cd
    training_state_checkpointing_steps: 1000
    checkpoints_total_limit: 3

  tracker:
    project_name: causal_forcing_cf
    run_name: cf_cd_chunkwise

  model:
    enable_gradient_checkpointing_type: full

callbacks:
  grad_clip:
    max_grad_norm: 1.0
  validation:
    pipeline_target: fastvideo.pipelines.basic.wan.wan_causal_pipeline.WanCausalPipeline
    dataset_file: examples/training/finetune/Wan2.1-VSA/Wan-Syn-Data/validation_4.json
    every_steps: 200
    sampling_steps: [4]
    guidance_scale: 6.0
    num_frames: 69

pipeline:
  flow_shift: 5
